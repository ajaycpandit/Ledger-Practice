{% extends "base.html" %}
{% block title %}New Learner — Ledger Practice{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">New Learner</h1>

<form method="post" class="card space-y-4 max-w-md">
    <div>
        <label class="block text-sm text-slate-600 mb-1">Name (used as login)</label>
        <input type="text" name="name" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-slate-600 mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-slate-600 mb-1">Company name (their "employer")</label>
        <input type="text" name="company_name" placeholder="e.g. Anand Traders Pvt Ltd"
               class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </div>
    <button type="submit" class="bg-slate-900 text-white rounded px-4 py-2 text-sm font-medium hover:bg-slate-800">
        Create Learner
    </button>
</form>
{% endblock %}
