{% extends "base.html" %}
{% block title %}Log in — Ledger Practice{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 card">
    <h1 class="text-lg font-semibold mb-4">Log in</h1>
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm text-slate-600 mb-1">Name</label>
            <input type="text" name="name" required
                   class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-slate-600 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit"
                class="w-full bg-slate-900 text-white rounded py-2 text-sm font-medium hover:bg-slate-800">
            Log in
        </button>
    </form>
</div>
{% endblock %}
